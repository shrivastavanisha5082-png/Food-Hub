<!DOCTYPE html>
<html>
<head>
    <title>Food Hub Login</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f5e6d3;
            margin: 0;
        }

        header {
            background-color: #2424b0;
            color: white;
            text-align: center;
            padding: 15px;
        }

        .box {
            width: 320px;
            margin: 70px auto;
            padding: 25px;
            background: white;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            color: #29278f;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid gray;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background-color: #192aa6;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #1d2396;
        }
    </style>
</head>

<body>

    <header>
        <h1>The Food Hub</h1>
    </header>

    <div class="box">

        <h2>Login</h2>

        <form id="loginForm">

            <input type="email"
                id="email"
                placeholder="Enter Email"
                required>

            <input type="password"
                id="password"
                placeholder="Enter Password"
                required>

            <button type="submit">Login</button>

        </form>

        <p>Don't have an account?</p>

        <button type="button" onclick="openCreatePage()">
            Create Account
        </button>

    </div>

    <script>

        

        function openCreatePage() {
            window.location.href = "create.html";
        }

        

        document.getElementById("loginForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            let email = document.getElementById("email").value.trim();
            let password = document.getElementById("password").value;

            

            let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!emailPattern.test(email)) {
                alert("Wrong Email! Please enter a proper email.");
                return;
            }

            

            if (password.length < 6) {
                alert("Wrong Password! Minimum 6 characters required.");
                return;
            }

            

            let savedEmail = localStorage.getItem("userEmail");
            let savedPassword = localStorage.getItem("userPassword");

            if (email !== savedEmail || password !== savedPassword) {

                alert("Wrong Email or Password! Please try again.");

                return;
            }

            

            alert("Logged In Successfully!");

            window.location.href = "dashboard.html";

        });

    </script>

</body>
</html>
